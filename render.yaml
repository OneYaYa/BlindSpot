services:
  - type: web
    name: blindspot-relay
    runtime: python
    plan: free
    buildCommand: python -m compileall -q server.py local_credentials.py
    startCommand: python server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: BLINDSPOT_RATE_LIMIT
        value: 10
